spring.application.name=webapi

# Databasanslutning med standardvärden
spring.datasource.url=jdbc:postgresql://${HOST:localhost}:${PORT:5432}/zoplanner
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:test123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate-inställningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Visa SQL-frågor (utvecklingsläge)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway för DB
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true