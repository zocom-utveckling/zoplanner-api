services:
  # PostgreSQL Database
  zoplanner-database:
    build: database/
    container_name: zoplanner-database
    networks:
      - zoplanner
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - zoplanner-data:/var/lib/postgresql/data
      - ../../zoplanner-notificationservice/database/migrations:/docker-entrypoint-initdb.d/notification
    restart: unless-stopped

  # pgAdmin4
  pgadmin:
    image: dpage/pgadmin4
    container_name: zoplanner-pgadmin
    networks:
      - zoplanner
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - zoplanner-database
    restart: unless-stopped

  # Spring Boot Application
  app:
    build: .
    container_name: zoplanner
    networks:
      - zoplanner
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - zoplanner-database

  # .NET Application
  dotnet-service:
    build:
      context: C:\Users\Benny\DEVjensen\ZoPlanner-Notification\zoplanner-notificationservice\zoplanner-service\zoplannerservice
      dockerfile: Dockerfile
    container_name: zoplanner-dotnet
    networks:
      - zoplanner
    ports:
      - "5027:5027"
    env_file:
      - .env
    environment:
      - SpringApi__BaseUrl=http://zoplanner:8080/api
      - TOKENKEY=${TOKENKEY}
    restart: unless-stopped
    depends_on:
      - app

  # Frontend Application
  frontend:
    build:
      context: C:\Users\Benny\DEVjensen\ZoPlanner-Notification\zoplanner-notificationservice\zoplanner-frontend
      dockerfile: Dockerfile
    container_name: zoplanner-frontend
    networks:
      - zoplanner
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - app
      - dotnet-service

  # Notification Service
  notification-service:
    build:
      context: C:\Users\Benny\DEVjensen\ZoPlanner-Notification\zoplanner-notificationservice
      dockerfile: Dockerfile
    container_name: zoplanner-notification-service
    networks:
      - zoplanner
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - notification-logs:/app/notification-logs
    restart: unless-stopped
    depends_on:
      - zoplanner-database

networks:
  zoplanner:
    driver: bridge

volumes:
  zoplanner-data:
  notification-logs:
