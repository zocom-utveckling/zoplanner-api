# ======================================
# Spring Boot application settings
# ======================================
spring.application.name=webapi

# ======================================
# PostgreSQL connection via Docker
# ======================================
spring.datasource.url=jdbc:postgresql://${HOST:localhost}:${PORT:5432}/zoplanner
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:test123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# Hibernate / JPA settings
# ======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Visa SQL-frågor i loggen
spring.jpa.show-sql=true

# ======================================
# File Upload Configuration
# ======================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

