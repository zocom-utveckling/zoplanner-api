name: CI - Build and Test Java

on:
  push:
    branches: [ CI-build-test ]
  pull_request:
    branches: [ CI-build-test ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zoplanner_user
          POSTGRES_PASSWORD: zoplanner_password
          POSTGRES_DB: zoplanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 5432
      USERNAME: zoplanner_user
      PASSWORD: zoplanner_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -DskipTests
        working-directory: ./webapi

      - name: Run unit tests
        run: mvn test
        working-directory: ./webapi

      - name: Display test results
        if: always()
        run: |
          echo "Build completed!"